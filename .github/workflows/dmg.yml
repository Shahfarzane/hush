name: DMG

# A version tag (v1.2.0) publishes build/Hush.dmg as a GitHub Release. A
# manual run builds the same image and keeps it with the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Signed and notarized DMG
    runs-on: xcode-27
    # The signing secrets live in this environment, which only master and
    # version tags can use.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Use Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Install the Developer ID certificate and profiles
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_APP: ${{ secrets.DEVELOPER_ID_PROFILE_APP }}
          DEVELOPER_ID_PROFILE_EXTENSION: ${{ secrets.DEVELOPER_ID_PROFILE_EXTENSION }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo -n "$DEVELOPER_ID_P12" | base64 --decode -o "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          # codesign needs the intermediate to build the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDCA.cer -o "$RUNNER_TEMP/DeveloperIDCA.cer"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          for profile in "$DEVELOPER_ID_PROFILE_APP" "$DEVELOPER_ID_PROFILE_EXTENSION"; do
            echo -n "$profile" | base64 --decode -o "$RUNNER_TEMP/profile.provisionprofile"
            uuid="$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" | plutil -extract UUID raw -o - -)"
            mv "$RUNNER_TEMP/profile.provisionprofile" "$profiles/$uuid.provisionprofile"
          done

          echo -n "$ASC_KEY_P8" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign and notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make dmg ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: Hush-dmg
          path: build/Hush.dmg
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Hush.dmg --title "Hush $GITHUB_REF_NAME" --generate-notes
      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
