name: Tests

on:
  push:
    branches: [master]
  pull_request:
  # The weekly rule refresh starts it on its branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: make test_unit
      - run: make check_format

  apps:
    name: App builds and Swift tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      # The Xcode build runs `make xcode_extension`, which needs Node and the
      # packages in package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Use Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Build the iOS app
        run: xcodebuild build -project Hush.xcodeproj -scheme 'Hush iOS' -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build the macOS app and run the Swift tests
        run: xcodebuild test -project Hush.xcodeproj -scheme 'Hush macOS' -destination 'platform=macOS' -only-testing:HushTests CODE_SIGNING_ALLOWED=NO
